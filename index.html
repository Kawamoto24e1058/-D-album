<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>思い出アルバム3D（Phase 0）</title>
  </head>
  <body>
    <header>
      <h1>思い出アルバム3D <small>Phase 0 品質検証</small></h1>
      <p id="status" role="status">写真を選ぶ（またはドラッグ&amp;ドロップする）とモデルを読み込みます。写真は端末の外に送信しません。</p>
    </header>

    <main>
      <section id="stage-wrap">
        <div id="stage" aria-label="3D表示。ドラッグ、矢印キー、または端末の傾きで視点を動かせます"></div>
        <p class="badge">AIによる推定を含みます</p>
        <p id="metrics" class="metrics"></p>
      </section>

      <aside id="panel">
        <div class="row">
          <label class="button primary">
            写真を追加
            <input id="file" type="file" accept="image/*" multiple hidden />
          </label>
          <button id="gyro" type="button">傾きで動かす</button>
          <button id="recenter" type="button">中央に戻す</button>
          <button id="auto" type="button" aria-pressed="true">自動再生</button>
        </div>

        <ul id="photos" aria-label="読み込んだ写真"></ul>

        <fieldset>
          <legend>見せ方</legend>
          <label>カメラワーク
            <select id="cameraMode">
              <option value="sway">ゆらぎ（覗き込み）</option>
              <option value="dolly">ドリーズーム（背景が遠のく）</option>
              <option value="push">押し込み（写真の中へ）</option>
            </select>
          </label>
          <label>演出
            <select id="effect">
              <option value="none">なし</option>
              <option value="snow">雪</option>
              <option value="sakura">桜</option>
              <option value="light">光の粒</option>
            </select>
          </label>
          <div class="row"><button id="replay" type="button">立ち上がりを再生</button></div>
        </fieldset>

        <fieldset>
          <legend>表示パラメータ</legend>
          <label>奥行きの強さ <input id="depthScale" type="range" min="0" max="1.5" step="0.05" /> <output></output></label>
          <label>視点の移動範囲 <input id="maxOffset" type="range" min="0" max="0.2" step="0.01" /> <output></output></label>
          <label>輪郭の透明化 <input id="edge" type="range" min="0.02" max="1" step="0.01" /> <output></output></label>
        </fieldset>

        <form id="score">
          <fieldset>
            <legend>採点（5 = 気にならない）</legend>
            <label>分類 <select id="category"></select></label>
            <div id="criteria"></div>
            <label>メモ <input id="note" type="text" maxlength="200" /></label>
            <button type="submit" class="primary">この写真の採点を記録</button>
          </fieldset>
        </form>

        <section>
          <h2>採点表</h2>
          <p id="summary"></p>
          <div class="table-wrap"><table id="table"></table></div>
          <div class="row">
            <button id="download" type="button">CSVをダウンロード</button>
            <button id="clear" type="button">採点表を消去</button>
          </div>
        </section>
      </aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
